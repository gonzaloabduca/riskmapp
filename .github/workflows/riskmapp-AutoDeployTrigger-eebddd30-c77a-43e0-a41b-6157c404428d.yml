name: Trigger auto deployment for riskmapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/riskmapp-AutoDeployTrigger-eebddd30-c77a-43e0-a41b-6157c404428d.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RISKMAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RISKMAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RISKMAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: cafab2b3ee0dacr.azurecr.io
          registryUsername: ${{ secrets.RISKMAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RISKMAPP_REGISTRY_PASSWORD }}
          containerAppName: riskmapp
          resourceGroup: riskmapp-rg
          imageToBuild: cafab2b3ee0dacr.azurecr.io/riskmapp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


